name: Verify

on:
  pull_request:
  push:
    branches:
      - production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and optimizer regression tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser sample route verifier
        run: |
          npm run start > /tmp/route-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000 > /dev/null
          npm run verify:sample-ui

      - name: Run sample-address route verifier
        run: npm run verify:sample-route

      - name: Run first-20 sample-address route verifier
        run: npm run verify:sample-20-shuffles

      - name: Run shuffled sample-address route verifier
        run: npm run verify:sample-shuffles

      - name: Run selected-end sample-address route verifier
        run: npm run verify:sample-shuffles:selected-end

      - name: Run round-trip sample-address route verifier
        run: npm run verify:sample-shuffles:round-trip

      - name: Run randomized route-shape verifier
        run: npm run verify:random-routes

      - name: Run 5,000-stop route benchmarks
        run: npm run benchmark:routes:5000:all

      - name: Run shuffled 5,000-stop route benchmark
        run: npm run benchmark:routes:5000:shuffles

      - name: Run selected-end shuffled 5,000-stop route benchmark
        run: npm run benchmark:routes:5000:shuffles:selected-end

      - name: Run round-trip shuffled 5,000-stop route benchmark
        run: npm run benchmark:routes:5000:shuffles:round-trip
